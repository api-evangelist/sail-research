aid: sail-research
name: Sail Research
description: >-
  Sail Research provides infrastructure for long-horizon agents: cost-efficient inference
  for leading open-source models (GLM, DeepSeek, Kimi, Nemotron and others) run on demand.
  Its API is OpenAI- and Anthropic-compatible (Chat Completions, Responses, Messages, Batches),
  so existing clients migrate by changing the base URL and key. Completion windows
  (asap/priority/standard/flex) trade latency for lower per-token price for background and
  agentic workloads, and Sailboxes provide full persistent VMs for long-running agents.
  Sail raised $80M and is backed by Kleiner Perkins. This profile was enriched by the API
  Evangelist pipeline from Sail's public OpenAPI, docs, SDKs, CLI, and MCP surface.
