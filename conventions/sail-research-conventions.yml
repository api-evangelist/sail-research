authentication:
  style: bearer
  header: "Authorization: Bearer $SAIL_API_KEY"
  format: API Key
  see: authentication/sail-research-authentication.yml
idempotency:
  supported: true
  header: Idempotency-Key
  in: header
  required: false
  max_length: 255
  scope: "keyed by (organization, API key, Idempotency-Key)"
  behavior: >-
    Retrying with the same key returns the previously stored response instead of
    re-running inference. Applies to POST /responses, /chat/completions, /messages, /batches.
  docs: https://docs.sailresearch.com/idempotency
pagination:
  style: cursor
  params: [after_id, before_id, limit]
  applies_to: [GET /batches]
metadata:
  object: metadata
  fields: [completion_window, completion_webhook, webhook_token]
  notes: >-
    Per-request metadata controls completion window (asap/priority/standard/flex latency-cost
    tier), a completion webhook URL, and a bearer token used to authenticate webhook delivery.
completion_windows:
  tiers: [asap, priority, standard, flex]
  notes: "Longer completion windows lower per-token price. See docs.sailresearch.com/completion-windows."
error_envelope:
  shape: '{ "error": { "message", "type", "param", "code" } }'
  format: openai-compatible error object
  see: errors/sail-research-problem-types.yml
